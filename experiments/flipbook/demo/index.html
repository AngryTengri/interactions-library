<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flipbook scrub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- The stage is the area that listens to the pointer.
         Inside it is one image. The JavaScript keeps changing which frame it shows.
         CHANGE THIS: the first frame of your own animation, and its description. -->
    <div id="stage">
      <img id="frame" src="assets/frame-01.png" alt="Placeholder animation: a ball bouncing across the frame">
    </div>

    <p>Move across the picture, slowly or fast, forwards or back. On a phone, drag.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
