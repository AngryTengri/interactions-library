<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound map</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="map">

    <!-- CHANGE THIS: your own map, drawing or photograph, and its description. -->
    <img src="assets/map.svg" alt="Placeholder map">

    <!-- The sound spots. Each one has:
         left and top: where it sits on the picture, as a percentage
                       (50% and 50% is the exact middle of the picture)
         data-sound:   the recording that plays there
         CHANGE THIS: the positions and your own mp3 files. Copy a line to add a spot. -->
    <div class="spot" style="left: 22%; top: 30%;" data-sound="assets/sound-1.mp3"></div>
    <div class="spot" style="left: 70%; top: 38%;" data-sound="assets/sound-2.mp3"></div>
    <div class="spot" style="left: 45%; top: 78%;" data-sound="assets/sound-3.mp3"></div>

    <!-- Browsers do not allow sound until the visitor has clicked something.
         This button covers the map until they do. -->
    <button id="start">Click to listen</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
