<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torchlight reveal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The scene has two layers, one on top of the other. -->
  <div id="scene">

    <!-- Bottom layer: the picture to be discovered.
         CHANGE THIS: your own photograph or drawing, and its description in alt. -->
    <img src="assets/place.svg" alt="Placeholder picture of a place, with small details to find">

    <!-- Top layer: the darkness. The CSS cuts a hole of light in it. -->
    <div class="dark"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
