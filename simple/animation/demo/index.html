<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animation</title>
  <!-- Connects the CSS file, which says how the page looks. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- Two shapes. The CSS moves them.
         They could be pictures instead: give an <img> the class "float" or "pulse". -->
    <div class="float"></div>
    <div class="pulse"></div>
  </main>

  <!-- Connects the JavaScript file, which says how the page behaves.
       It goes last, so the page is there before the script looks for things in it. -->
  <script src="script.js"></script>
</body>
</html>
