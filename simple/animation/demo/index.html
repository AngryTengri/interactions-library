<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- Two shapes. The CSS moves them. They could be images instead:
         give an <img> the class "float" or "pulse". -->
    <div class="stage">
      <div class="float"></div>
      <div class="pulse"></div>
    </div>

    <button id="pause">Pause</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
