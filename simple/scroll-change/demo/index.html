<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll change</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- A bar across the top that grows as you scroll. -->
  <div class="bar"></div>

  <!-- The sun. It stays fixed on the screen and the scroll moves it. -->
  <div class="sun"></div>

  <!-- The text is only here to make the page long enough to scroll.
       CHANGE THIS: replace it with your own content. -->
  <main>
    <p>Morning. Scroll down.</p>
    <p>Midday. Placeholder text.</p>
    <p>Afternoon. Placeholder text.</p>
    <p>Evening. Placeholder text.</p>
    <p>Night.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
