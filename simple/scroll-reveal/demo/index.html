<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll reveal</title>
  <!-- Connects the CSS file, which says how the page looks. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <p>Scroll down.</p>

    <!-- Anything with the class "reveal" starts invisible and fades in
         when it scrolls onto the screen. It can be text or a picture.
         CHANGE THIS: the words. Copy a line to add more. -->
    <p class="reveal">Placeholder line one.</p>
    <p class="reveal">Placeholder line two.</p>
    <p class="reveal">Placeholder line three.</p>
    <p class="reveal">The end.</p>
  </main>

  <!-- Connects the JavaScript file, which says how the page behaves.
       It goes last, so the page is there before the script looks for things in it. -->
  <script src="script.js"></script>
</body>
</html>
