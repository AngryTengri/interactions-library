<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll reveal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <p class="start">Scroll down.</p>

    <!-- Anything with the class "reveal" starts invisible and fades in
         when it scrolls onto the screen. It can be text or an image.
         CHANGE THIS: the words. Copy a line to add more. -->
    <p class="reveal">Placeholder line one.</p>
    <p class="reveal">Placeholder line two.</p>
    <p class="reveal">Placeholder line three.</p>
    <p class="reveal">Placeholder line four.</p>
    <p class="reveal">The end. Scroll back up.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
