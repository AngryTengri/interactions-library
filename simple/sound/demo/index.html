<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound</title>
  <!-- Connects the CSS file, which says how the page looks. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <button id="bell-button">Ring the bell</button>
    <button id="start-button">Start the hum</button>
    <button id="stop-button">Stop the hum</button>
  </main>

  <!-- The sounds. An audio element cannot be seen: the buttons control it.
       CHANGE THIS: src is the sound file. Use your own recordings, saved as mp3.
       "loop" makes the hum start again each time it reaches the end. -->
  <audio id="bell" src="assets/bell.mp3"></audio>
  <audio id="hum" src="assets/hum.mp3" loop></audio>

  <!-- Connects the JavaScript file, which says how the page behaves.
       It goes last, so the page is there before the script looks for things in it. -->
  <script src="script.js"></script>
</body>
</html>
