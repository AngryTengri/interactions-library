<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor follow</title>
  <!-- Connects the CSS file, which says how the page looks. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <p>Move the pointer. On a phone, drag a finger.</p>

  <!-- The thing that follows the pointer. Here it is an empty box that the CSS
       turns into a circle.
       CHANGE THIS: to use your own picture, replace the line below with
       <img id="follower" src="assets/your-file.png" alt="">
       The id must stay "follower". Then, in the CSS, delete the
       border-radius and background lines, and change height to auto. -->
  <div id="follower"></div>

  <!-- Connects the JavaScript file, which says how the page behaves.
       It goes last, so the page is there before the script looks for things in it. -->
  <script src="script.js"></script>
</body>
</html>
