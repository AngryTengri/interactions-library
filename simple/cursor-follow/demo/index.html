<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor follow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <p>Move the pointer. On a phone, drag a finger.</p>
  </main>

  <!-- The thing that follows the pointer. Here it is an empty box that the CSS
       turns into a circle.
       CHANGE THIS: to use your own image, replace the line below with
       <img id="follower" src="assets/your-file.png" alt="">
       The id must stay "follower". Then, in the CSS, delete the three lines
       that make the circle: border-radius, background and mix-blend-mode. -->
  <div id="follower"></div>

  <script src="script.js"></script>
</body>
</html>
