<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keyboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <p>Click here first, then press the arrow keys. This one needs a keyboard.</p>

    <!-- Shows the name of the last key that was pressed. -->
    <p>Last key: <span id="key-name">none yet</span></p>
  </main>

  <!-- The thing the keys move.
       CHANGE THIS: to use your own image, replace the line below with
       <img id="walker" src="assets/your-file.png" alt="">
       The id must stay "walker". Then, in the CSS, delete the background line
       and change height to auto. -->
  <div id="walker"></div>

  <script src="script.js"></script>
</body>
</html>
