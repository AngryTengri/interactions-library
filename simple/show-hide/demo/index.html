<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Show and hide</title>
  <!-- Connects the CSS file, which says how the page looks. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- The button. CHANGE THIS: the words on it. -->
    <button id="toggle">Show or hide the memory</button>

    <!-- The hidden text. The class "hidden" hides it: see the CSS.
         CHANGE THIS: the text. It could be a picture instead:
         keep id="memory" and class="hidden" on it. -->
    <p id="memory" class="hidden">Placeholder text. Write a memory of your place here.</p>
  </main>

  <!-- Connects the JavaScript file, which says how the page behaves.
       It goes last, so the page is there before the script looks for things in it. -->
  <script src="script.js"></script>
</body>
</html>
