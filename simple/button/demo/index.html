<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button</title>
  <!-- Connects the CSS file: how the page looks. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- The message that the button changes.
         The id is a name, so the JavaScript can find this exact element. -->
    <p id="message">It is day.</p>

    <!-- The button. CHANGE THIS: the words on it. -->
    <button id="light-switch">Turn off the light</button>
  </main>

  <!-- Connects the JavaScript file: how the page behaves.
       It comes last, so the page exists before the script runs. -->
  <script src="script.js"></script>
</body>
</html>
