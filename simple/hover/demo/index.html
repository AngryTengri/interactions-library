<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <p class="hint">Move the pointer over each word. On a phone, tap.</p>

    <!-- Each word is a button, so it can also be reached with the Tab key.
         The class says which hover effect it gets. All the effects are in the CSS. -->
    <div class="words">
      <button class="grow">grow</button>
      <button class="colour">colour</button>
      <button class="focus">focus</button>
      <button class="tilt">tilt</button>
      <button class="vanish">vanish</button>
      <button class="slow">slow</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
