<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slider</title>
  <!-- Connects the CSS file, which says how the page looks. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- CHANGE THIS: your own picture, and a description of it in alt. -->
    <img id="picture" src="assets/picture.svg" alt="Placeholder picture">

    <!-- The label names the slider. "for" links it to the slider's id. -->
    <label for="slider">Blur</label>

    <!-- The slider. min is the number at the left end, max at the right end,
         and value is where the handle starts.
         CHANGE THIS: the numbers. -->
    <input type="range" id="slider" min="0" max="20" value="0">
  </main>

  <!-- Connects the JavaScript file, which says how the page behaves.
       It goes last, so the page is there before the script looks for things in it. -->
  <script src="script.js"></script>
</body>
</html>
